name: Pull request labeler

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label-pr:
    name: Label pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Read the base-branch labeler configuration.
      issues: write # Create configured labels that do not exist yet.
      pull-requests: write # Apply and synchronize pull request labels.

    steps:
      - name: Run labeler
        uses: actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
