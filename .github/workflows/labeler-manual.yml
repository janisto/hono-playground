name: Manually label pull requests

on:
  workflow_dispatch:
    inputs:
      maxCount:
        description: "Maximum number of pull requests to process"
        required: true
        default: 200
        type: number
      scope:
        description: "Which pull requests to consider"
        required: true
        default: "closed"
        type: choice
        options:
          - closed
          - all

concurrency:
  group: label-pull-requests
  cancel-in-progress: false

permissions: {}

jobs:
  collect-prs:
    name: Collect pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: read # List pull requests selected for relabeling.
    outputs:
      pr_numbers: ${{ steps.get_prs.outputs.pr_numbers }}
      pr_count: ${{ steps.get_prs.outputs.pr_count }}

    steps:
      - name: Collect pull request numbers
        id: get_prs
        uses: actions/github-script@v9.0.0
        with:
          retries: 3
          script: |
            const maxCount = Number(process.env.INPUT_MAX_COUNT);
            if (!Number.isSafeInteger(maxCount) || maxCount < 1 || maxCount > 256) {
              throw new Error("maxCount must be an integer between 1 and 256");
            }

            const scope = process.env.INPUT_SCOPE;
            if (scope !== "closed" && scope !== "all") {
              throw new Error("scope must be either 'closed' or 'all'");
            }

            const allPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: scope,
              per_page: 100,
              headers: {
                accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2026-03-10",
              },
            });

            const pullRequestNumbers = allPullRequests
              .map((pullRequest) => pullRequest.number)
              .sort((left, right) => right - left)
              .slice(0, maxCount);

            core.info(
              `Collected ${pullRequestNumbers.length} ${scope} pull requests (maximum ${maxCount})`,
            );
            core.setOutput("pr_numbers", JSON.stringify(pullRequestNumbers));
            core.setOutput("pr_count", String(pullRequestNumbers.length));
        env:
          INPUT_MAX_COUNT: ${{ inputs.maxCount }}
          INPUT_SCOPE: ${{ inputs.scope }}

  label-prs:
    name: Label pull request ${{ matrix.pr }}
    if: needs.collect-prs.outputs.pr_count != '0'
    needs: collect-prs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Read the base-branch labeler configuration.
      issues: write # Create configured labels that do not exist yet.
      pull-requests: write # Apply and synchronize pull request labels.
    strategy:
      max-parallel: 10
      matrix:
        pr: ${{ fromJson(needs.collect-prs.outputs.pr_numbers) }}

    steps:
      - name: Run labeler
        uses: actions/labeler@v7.0.0
        with:
          pr-number: ${{ matrix.pr }}
          configuration-path: .github/labeler.yml
          sync-labels: true
