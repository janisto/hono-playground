name: App validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow syntax
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Check workflow security
        uses: zizmorcore/zizmor-action@v0.8.1
        env:
          ZIZMOR_OFFLINE: "true"
        with:
          version: "1.32.0"
          persona: pedantic
          online-audits: false
          advanced-security: false

  ci:
    name: ci
    needs: zizmor
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Require workflow checks to succeed
        env:
          WORKFLOW_CHECKS: ${{ needs.zizmor.result }}
        run: test "$WORKFLOW_CHECKS" = success

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce append-only migration history
        env:
          MIGRATION_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git diff --quiet --find-renames --diff-filter=MDR "$MIGRATION_BASE_SHA" HEAD -- drizzle/; then
            echo "Existing Drizzle migrations are immutable; add a forward migration instead." >&2
            git diff --name-status --find-renames --diff-filter=MDR "$MIGRATION_BASE_SHA" HEAD -- drizzle/ >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false

      - name: Use pinned Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Typecheck source, tests, and infrastructure
        run: pnpm typecheck

      - name: Check migration history and schema freshness
        run: pnpm db:check

      - name: Audit dependencies
        run: pnpm run audit

      - name: Run test coverage
        run: pnpm coverage

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm test:e2e

      - name: Upload validation reports
        if: ${{ !cancelled() && hashFiles('coverage/**', 'test-results/**') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: validation-reports
          path: |
            coverage
            test-results
