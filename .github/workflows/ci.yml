name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Node 24 QA and deploy dry run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11.15.1
          run_install: false

      - name: Install Node from .node-version
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Record pinned tool versions
        run: |
          node --version
          pnpm --version
          pnpm exec wrangler --version

      - name: Run generated-file, license, test, configuration, and dry-run gates
        run: pnpm qa

      - name: Install pinned Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run same-origin documentation browser smoke
        run: pnpm test:e2e
